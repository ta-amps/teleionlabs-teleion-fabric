<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 304" role="img" aria-labelledby="acc-title acc-desc">
  <title id="acc-title">Strict Exact-Match Accuracy Before and After PEFT QLoRA Fine-Tuning of Muse Glimmer 30B</title>
  <desc id="acc-desc">Comparison of the unchanged Muse Glimmer 30B base model versus its PEFT QLoRA specialist adapter on unseen Teleion Fabric MCP tool-call holdout splits (n=150 per split): the frozen test rises from 87.3% to 98.7%, and the pre-registered fresh holdout rises from 93.3% to 99.3%.</desc>
  <rect width="860" height="304" rx="12" fill="#fbfaf7"/>
  <rect x="1" y="1" width="858" height="302" rx="11" fill="none" stroke="#d8d3c8" stroke-width="1.5"/>

  <text x="32" y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#181816">Typed Tool-Call Exact Match on Unseen Holdout Splits (n = 150 each)</text>
  <text x="32" y="64" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#525049">Made-up Teleion Fabric MCP specialist task. It shows the Task and Task Object loop, not general capability.</text>

  <!-- Legend -->
  <rect x="32" y="82" width="14" height="14" rx="3" fill="#9a9488"/>
  <text x="52" y="94" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2c2b28">Unchanged Base Model</text>
  <rect x="220" y="82" width="14" height="14" rx="3" fill="#1e5a46"/>
  <text x="240" y="94" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2c2b28">Promoted PEFT QLoRA Adapter</text>

  <!-- Grid lines (0%, 25%, 50%, 75%, 100%) mapped from x=270 to x=770 (width 500) -->
  <g stroke="#e5e0d5" stroke-width="1">
    <line x1="270" y1="116" x2="270" y2="250"/>
    <line x1="395" y1="116" x2="395" y2="250"/>
    <line x1="520" y1="116" x2="520" y2="250"/>
    <line x1="645" y1="116" x2="645" y2="250"/>
    <line x1="770" y1="116" x2="770" y2="250"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5c5952" text-anchor="middle">
    <text x="270" y="270">0%</text>
    <text x="395" y="270">25%</text>
    <text x="520" y="270">50%</text>
    <text x="645" y="270">75%</text>
    <text x="770" y="270">100%</text>
  </g>

  <!-- Row 1: Muse Glimmer 30B (Frozen test) -->
  <text x="32" y="143" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#181816">Muse Glimmer 30B (Frozen)</text>
  <text x="32" y="161" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#5c5952">4-bit QLoRA r=16 (free 2x T4)</text>
  <rect x="270" y="128" width="436.5" height="16" rx="3" fill="#9a9488"/>
  <text x="713" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3b3935">87.3%</text>
  <rect x="270" y="148" width="493.5" height="18" rx="3" fill="#1e5a46"/>
  <text x="770" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1e5a46" text-anchor="start" dx="6">98.7%</text>

  <!-- Row 2: Muse Glimmer 30B (Pre-registered fresh holdout) -->
  <text x="32" y="211" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#181816">Muse Glimmer 30B (Fresh)</text>
  <text x="32" y="229" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#5c5952">Pre-registered SHA-256 holdout</text>
  <rect x="270" y="196" width="466.5" height="16" rx="3" fill="#9a9488"/>
  <text x="743" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3b3935">93.3%</text>
  <rect x="270" y="216" width="496.5" height="18" rx="3" fill="#1e5a46"/>
  <text x="770" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1e5a46" text-anchor="start" dx="6">99.3%</text>

  <text x="32" y="291" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#5c5952">Pre-registered gate: the fresh-holdout gain (+6.0 pts, 95% CI +2.0 to +10.7) cleared all 12 of 12 promotion checks.</text>
</svg>
